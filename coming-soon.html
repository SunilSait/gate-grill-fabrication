<!DOCTYPE html>
<html lang="en" id="root-html">
<head>

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body class="fullscreen-page">

<!-- Top Bar -->
<div style="display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;max-width:1200px;margin:0 auto;width:100%;">
    <a href="index.html" class="nav-logo" aria-label="IronCraft Home" style="text-decoration:none;">
        <img src="logo.svg" alt="IronCraft Logo" width="38" height="38" style="width:38px;height:38px;object-fit:contain;display:block;" />
        <div class="nav-logo-text">
            <span class="brand-top">IronCraft</span>
            <span class="brand-bottom">Gate &amp; Grill</span>
        </div>
    </a>
    <div style="display:flex;gap:0.5rem;">
        <button onclick="toggleDir()" class="auth-toggle-btn" title="Toggle Direction">
            <span class="dir-label" style="font-size:0.625rem;font-weight:600;">LTR</span>
        </button>
        <button onclick="toggleTheme()" class="auth-toggle-btn" title="Toggle Theme" aria-label="Toggle dark mode">
            <span class="theme-icon-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
        </button>
    </div>
</div>

<!-- Content -->
<div class="fullscreen-content">
    <div style="position:relative;max-width:540px;width:100%;margin:0 auto;">
        <!-- Decorative glow -->
        <div style="position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);width:min(450px, 90vw);height:min(450px, 90vw);background:radial-gradient(circle,rgba(180,83,9,0.15),transparent 65%);border-radius:50%;pointer-events:none;"></div>

        <div style="position:relative;z-index:2;">
            <div class="section-tag" style="background:rgba(180,83,9,0.2);border-color:rgba(180,83,9,0.4);margin-bottom:1rem;color:#F59E0B;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:0.35rem;"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4.5C7.5 6 10 5.5 10 5.5"/><path d="M12 15v5s3.03-.55 4.5-2c1.5-1.5 2-4.5 2-4.5"/></svg>
                Under Construction
            </div>
            <h1 class="coming-title">Coming Soon</h1>
            <p class="coming-desc">
                We're crafting something exciting for you. This new feature will be available soon. Subscribe to get notified when we launch!
            </p>

            <!-- Countdown -->
            <div class="countdown-grid" id="countdown">
                <div class="countdown-item">
                    <div class="countdown-value" id="cd-days">28</div>
                    <div class="countdown-label">Days</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-value" id="cd-hours">14</div>
                    <div class="countdown-label">Hours</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-value" id="cd-secs-wrap">
                        <span class="countdown-value" id="cd-mins">36</span>
                    </div>
                    <div class="countdown-label">Minutes</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-value" id="cd-secs">52</div>
                    <div class="countdown-label">Seconds</div>
                </div>
            </div>

            <!-- Subscribe -->
            <form class="subscribe-form" onsubmit="event.preventDefault(); alert('Subscribed! We will notify you when this feature launches.'); this.reset();">
                <input type="email" placeholder="your@email.com" required>
                <button type="submit" class="btn btn-primary">Notify Me</button>
            </form>

            <!-- Social -->
            <div class="coming-socials">
                <a href="https://facebook.com" target="_blank" rel="noopener" class="coming-social-link" aria-label="Facebook"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg></a>
                <a href="https://instagram.com" target="_blank" rel="noopener" class="coming-social-link" aria-label="Instagram"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg></a>
                <a href="https://youtube.com" target="_blank" rel="noopener" class="coming-social-link" aria-label="YouTube"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19.1c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.43z"/><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"/></svg></a>
                <a href="https://wa.me/919840000000" target="_blank" rel="noopener" class="coming-social-link" aria-label="WhatsApp"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></a>
            </div>

            <div style="margin-top:2rem;">
                <a href="index.html" class="link-primary" style="font-size:0.875rem;">&larr; Back to Home</a>
            </div>
        </div>
    </div>
</div>

<script src="components.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + 28);

        function updateCountdown() {
            const now = new Date();
            const diff = targetDate - now;
            if (diff <= 0) return;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('cd-days').textContent = String(days).padStart(2, '0');
            document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('cd-mins').textContent = String(mins).padStart(2, '0');
            document.getElementById('cd-secs').textContent = String(secs).padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    });
</script>
</body>
</html>
