<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found. The page you're looking for doesn't exist or has been moved.">
    <title>404 — Page Not Found | IronCraft</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <style>
        .error-illustration {
            position: relative;
            display: inline-block;
            margin-bottom: 2rem;
        }
        .error-illustration .gate-spin {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140px;
            height: 140px;
            opacity: 0.15;
            animation: spin 16s linear infinite;
        }
    </style>
</head>
<body class="fullscreen-page">

<!-- Top Bar -->
<div style="display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;max-width:1200px;margin:0 auto;width:100%;">
    <a href="index.html" class="nav-logo" aria-label="IronCraft Home" style="text-decoration:none;">
        <img src="logo.svg" alt="IronCraft Logo" width="38" height="38" style="width:38px;height:38px;object-fit:contain;display:block;" />
        <div class="nav-logo-text">
            <span class="brand-top">IronCraft</span>
            <span class="brand-bottom">Gate &amp; Grill</span>
        </div>
    </a>
    <div style="display:flex;gap:0.5rem;">
        <button onclick="toggleDir()" class="auth-toggle-btn" title="Toggle Direction">
            <span class="dir-label" style="font-size:0.625rem;font-weight:600;">LTR</span>
        </button>
        <button onclick="toggleTheme()" class="auth-toggle-btn" title="Toggle Theme" aria-label="Toggle dark mode">
            <span class="theme-icon-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
        </button>
    </div>
</div>

<!-- Content -->
<div class="fullscreen-content">
    <div style="position:relative;max-width:540px;width:100%;margin:0 auto;">
        <div class="error-illustration">
            <!-- Spinning gear/gate element behind -->
            <svg class="gate-spin" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="60" cy="60" r="50" stroke="#B45309" stroke-width="4" stroke-dasharray="8 6"/>
                <circle cx="60" cy="60" r="30" stroke="#B45309" stroke-width="3"/>
                <path d="M60 10 V110 M10 60 H110" stroke="#B45309" stroke-width="3"/>
            </svg>
            <div class="error-code">404</div>
        </div>

        <h1 class="error-subtitle">Oops! Page Not Found</h1>
        <p class="error-desc">The gate to this page seems to be closed! The page you're looking for has been moved, renamed, or doesn't exist.</p>

        <div style="display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;margin-bottom:2.5rem;">
            <a href="index.html" class="btn btn-primary btn-lg">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Back to Home
            </a>
            <a href="contact.html" class="btn btn-secondary btn-lg">Contact Support</a>
        </div>

        <div style="border-top:1px solid var(--border-default);padding-top:2rem;">
            <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:1rem;">Or explore our main pages:</p>
            <div style="display:flex;flex-wrap:wrap;gap:0.5rem;justify-content:center;">
                <a href="products.html" class="btn btn-secondary btn-sm">Products</a>
                <a href="gallery.html" class="btn btn-secondary btn-sm">Design Gallery</a>
                <a href="materials.html" class="btn btn-secondary btn-sm">Materials</a>
                <a href="pricing.html" class="btn btn-secondary btn-sm">Pricing</a>
                <a href="contact.html" class="btn btn-secondary btn-sm">Contact</a>
            </div>
        </div>
    </div>
</div>

<script src="components.js"></script>
</body>
</html>
